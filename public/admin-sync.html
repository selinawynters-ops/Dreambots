<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>DreamTavern · Sync Manager</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base:      #0a0a12;
            --bg-panel:     #12111e;
            --bg-card:      #1a1829;
            --bg-hover:     #221f35;
            --border:       rgba(147, 112, 219, 0.18);
            --border-glow:  rgba(147, 112, 219, 0.45);
            --accent:       #9370db;
            --accent-soft:  #b39ddb;
            --accent-dim:   rgba(147, 112, 219, 0.15);
            --text-primary: #e1d9f5;
            --text-muted:   #8880aa;
            --text-faint:   #4a4570;
            --green:        #66bb9a;
            --green-dim:    rgba(102, 187, 154, 0.15);
            --green-border: rgba(102, 187, 154, 0.35);
            --red:          #e07070;
            --red-dim:      rgba(224, 112, 112, 0.15);
            --shadow:       0 8px 32px rgba(0,0,0,0.6);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo-icon { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 14px rgba(147,112,219,0.4); }
        header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
        header h1 span { color: var(--accent-soft); }
        .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

        /* ── Layout ── */
        .page { padding: 24px 28px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        /* ── Controls bar ── */
        .controls-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .stat { display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); }
        .stat-value { font-size: 13px; color: var(--text-muted); }
        .controls-btns { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

        /* ── Card ── */
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 14px;
        }
        .card-header {
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-soft); }
        .card-header .badge {
            margin-left: auto;
            background: var(--accent-dim);
            color: var(--accent-soft);
            border: 1px solid rgba(147,112,219,0.3);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .card-body { padding: 14px 18px; }

        /* ── Selector grid ── */
        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 680px) { .selector-grid { grid-template-columns: 1fr; } }

        .field-label {
            font-size: 12px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 7px;
        }
        .preset-stack { display: flex; flex-direction: column; gap: 14px; }

        /* ── Multi-select dropdown ── */
        .ms-wrap { position: relative; }

        .ms-trigger {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 36px 9px 12px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.15s;
            user-select: none;
            position: relative;
        }
        .ms-trigger:hover, .ms-trigger.open { border-color: var(--border-glow); }
        .ms-trigger-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); }
        .ms-trigger-text.has-selection { color: var(--text-primary); }
        .ms-trigger-arrow {
            position: absolute; right: 11px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint); font-size: 11px;
            transition: transform 0.2s; pointer-events: none;
        }
        .ms-trigger.open .ms-trigger-arrow { transform: translateY(-50%) rotate(180deg); }

        .ms-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px); left: 0; right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            box-shadow: var(--shadow);
            z-index: 200;
            overflow: hidden;
        }
        .ms-dropdown.open { display: flex; flex-direction: column; }

        .ms-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); position: relative; }
        .ms-search {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 7px 10px 7px 30px;
            color: var(--text-primary);
            font-size: 13px; outline: none;
        }
        .ms-search::placeholder { color: var(--text-faint); }
        .ms-search:focus { border-color: var(--border-glow); }
        .ms-search-icon {
            position: absolute; left: 17px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint); font-size: 12px; pointer-events: none;
        }

        .ms-actions { padding: 5px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
        .ms-action-btn {
            font-size: 11px; color: var(--accent-soft);
            background: none; border: none; cursor: pointer; padding: 2px 0; opacity: 0.8;
        }
        .ms-action-btn:hover { opacity: 1; text-decoration: underline; }

        .ms-list { max-height: 240px; overflow-y: auto; padding: 4px 0; }
        .ms-list::-webkit-scrollbar { width: 4px; }
        .ms-list::-webkit-scrollbar-track { background: transparent; }
        .ms-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .ms-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; cursor: pointer; transition: background 0.1s; font-size: 13px;
        }
        .ms-item:hover { background: var(--bg-hover); }
        .ms-item.hidden { display: none; }
        .ms-item input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
        .ms-item-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ms-item.checked .ms-item-label { color: var(--text-primary); }
        .ms-item:not(.checked) .ms-item-label { color: var(--text-muted); }
        /* Live count inside dropdown item */
        .ms-item-count {
            font-size: 10px; font-weight: 600; flex-shrink: 0;
            color: var(--green); opacity: 0.8;
        }
        .ms-empty { padding: 16px 12px; text-align: center; color: var(--text-faint); font-size: 12px; }

        /* ── Tags ── */
        .ms-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 0; }

        .ms-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--accent-dim);
            border: 1px solid rgba(147,112,219,0.3);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px; color: var(--accent-soft);
            max-width: 220px;
        }
        /* Live tag — already synced to users */
        .ms-tag.live {
            background: var(--green-dim);
            border-color: var(--green-border);
            color: var(--green);
        }
        .ms-tag span.ms-tag-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ms-tag span.ms-tag-count { flex-shrink: 0; font-size: 10px; opacity: 0.8; }
        .ms-tag span.ms-tag-remove { cursor: pointer; opacity: 0.6; flex-shrink: 0; font-size: 13px; line-height: 1; }
        .ms-tag span.ms-tag-remove:hover { opacity: 1; }

        /* ── Users grid ── */
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
        .user-chip {
            display: flex; align-items: center; gap: 9px;
            padding: 9px 11px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.2s;
        }
        .user-chip.opted-out { border-color: var(--red); background: var(--red-dim); }
        .user-chip.opted-out .user-status { color: var(--red); }
        .user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--accent-dim); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--accent-soft); font-weight: 600; flex-shrink: 0;
        }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-status { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

        /* ── Toggle ── */
        .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-track {
            position: absolute; inset: 0; border-radius: 20px;
            background: var(--bg-panel); border: 1px solid var(--border);
            transition: background 0.2s, border-color 0.2s; cursor: pointer;
        }
        .toggle-track::after {
            content: ''; position: absolute;
            width: 14px; height: 14px; top: 2px; left: 2px;
            border-radius: 50%; background: var(--text-faint);
            transition: transform 0.2s, background 0.2s;
        }
        .toggle input:checked + .toggle-track { background: var(--accent-dim); border-color: var(--accent); }
        .toggle input:checked + .toggle-track::after { transform: translateX(16px); background: var(--accent); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 18px; border-radius: 9px;
            font-size: 13px; font-weight: 500;
            border: none; cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) { opacity: 0.88; }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(147,112,219,0.3); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover:not(:disabled) { border-color: var(--border-glow); }

        /* ── Toast ── */
        #toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 12px 20px; border-radius: 10px;
            font-size: 13px; font-weight: 500;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none; z-index: 999; max-width: 380px;
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast.ok   { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
        #toast.err  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(224,112,112,0.35); }
        #toast.info { background: var(--accent-dim); color: var(--accent-soft); border: 1px solid rgba(147,112,219,0.3); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { display: inline-block; animation: spin 0.7s linear infinite; }
    </style>
</head>
<body>

<header>
    <img src="img/logo.png" alt="" class="logo-icon" onerror="this.style.display='none'">
    <h1>Dream<span>Tavern</span> · Sync Manager</h1>
    <div class="header-actions">
        <button class="btn btn-secondary" id="refreshBtn" onclick="loadStatus()">
            <span id="refreshIcon">↻</span> Refresh
        </button>
    </div>
</header>

<div class="page">

    <!-- Stats + actions -->
    <div class="controls-card">
        <div class="stat">
            <div class="stat-label">Last synced</div>
            <div class="stat-value" id="lastSynced">—</div>
        </div>
        <div class="stat">
            <div class="stat-label">Enabled files</div>
            <div class="stat-value" id="enabledCount">—</div>
        </div>
        <div class="stat">
            <div class="stat-label">Users receiving sync</div>
            <div class="stat-value" id="syncUserCount">—</div>
        </div>
        <div class="controls-btns">
            <button class="btn btn-primary" id="saveBtn" onclick="saveAndSync()">💾 Save &amp; Sync</button>
        </div>
    </div>

    <!-- File selectors -->
    <div class="card">
        <div class="card-header">
            <span>📋</span>
            <h2>Files to Sync</h2>
            <span class="badge" id="totalBadge">0 selected</span>
        </div>
        <div class="card-body">
            <div class="selector-grid">

                <!-- ── Lorebooks (left column) ── -->
                <div>
                    <div class="field-label">📖 Global Lorebooks</div>
                    <div class="ms-wrap">
                        <div class="ms-trigger" id="trigger-lorebook" onclick="toggleDropdown('lorebook')">
                            <span class="ms-trigger-text" id="triggerText-lorebook">None selected</span>
                            <span class="ms-trigger-arrow">▼</span>
                        </div>
                        <div class="ms-dropdown" id="dropdown-lorebook">
                            <div class="ms-search-wrap">
                                <span class="ms-search-icon">🔍</span>
                                <input class="ms-search" type="text" placeholder="Search lorebooks…"
                                       oninput="filterList('lorebook', this.value)"
                                       onclick="event.stopPropagation()">
                            </div>
                            <div class="ms-actions">
                                <button class="ms-action-btn" onclick="selectAllVisible('lorebook')">Select all</button>
                                <button class="ms-action-btn" onclick="clearAllVisible('lorebook')">Clear all</button>
                            </div>
                            <div class="ms-list" id="list-lorebook"></div>
                        </div>
                        <div class="ms-tags" id="tags-lorebook"></div>
                    </div>
                </div>

                <!-- ── Presets (right column, stacked) ── -->
                <div class="preset-stack">

                    <div>
                        <div class="field-label">⚙️ OpenAI Presets</div>
                        <div class="ms-wrap">
                            <div class="ms-trigger" id="trigger-openAI" onclick="toggleDropdown('openAI')">
                                <span class="ms-trigger-text" id="triggerText-openAI">None selected</span>
                                <span class="ms-trigger-arrow">▼</span>
                            </div>
                            <div class="ms-dropdown" id="dropdown-openAI">
                                <div class="ms-search-wrap">
                                    <span class="ms-search-icon">🔍</span>
                                    <input class="ms-search" type="text" placeholder="Search presets…"
                                           oninput="filterList('openAI', this.value)"
                                           onclick="event.stopPropagation()">
                                </div>
                                <div class="ms-actions">
                                    <button class="ms-action-btn" onclick="selectAllVisible('openAI')">Select all</button>
                                    <button class="ms-action-btn" onclick="clearAllVisible('openAI')">Clear all</button>
                                </div>
                                <div class="ms-list" id="list-openAI"></div>
                            </div>
                            <div class="ms-tags" id="tags-openAI"></div>
                        </div>
                    </div>

                    <div>
                        <div class="field-label">⚙️ TextGen Presets</div>
                        <div class="ms-wrap">
                            <div class="ms-trigger" id="trigger-textGen" onclick="toggleDropdown('textGen')">
                                <span class="ms-trigger-text" id="triggerText-textGen">None selected</span>
                                <span class="ms-trigger-arrow">▼</span>
                            </div>
                            <div class="ms-dropdown" id="dropdown-textGen">
                                <div class="ms-search-wrap">
                                    <span class="ms-search-icon">🔍</span>
                                    <input class="ms-search" type="text" placeholder="Search presets…"
                                           oninput="filterList('textGen', this.value)"
                                           onclick="event.stopPropagation()">
                                </div>
                                <div class="ms-actions">
                                    <button class="ms-action-btn" onclick="selectAllVisible('textGen')">Select all</button>
                                    <button class="ms-action-btn" onclick="clearAllVisible('textGen')">Clear all</button>
                                </div>
                                <div class="ms-list" id="list-textGen"></div>
                            </div>
                            <div class="ms-tags" id="tags-textGen"></div>
                        </div>
                    </div>

                    <div>
                        <div class="field-label">⚙️ NovelAI Presets</div>
                        <div class="ms-wrap">
                            <div class="ms-trigger" id="trigger-novelAI" onclick="toggleDropdown('novelAI')">
                                <span class="ms-trigger-text" id="triggerText-novelAI">None selected</span>
                                <span class="ms-trigger-arrow">▼</span>
                            </div>
                            <div class="ms-dropdown" id="dropdown-novelAI">
                                <div class="ms-search-wrap">
                                    <span class="ms-search-icon">🔍</span>
                                    <input class="ms-search" type="text" placeholder="Search presets…"
                                           oninput="filterList('novelAI', this.value)"
                                           onclick="event.stopPropagation()">
                                </div>
                                <div class="ms-actions">
                                    <button class="ms-action-btn" onclick="selectAllVisible('novelAI')">Select all</button>
                                    <button class="ms-action-btn" onclick="clearAllVisible('novelAI')">Clear all</button>
                                </div>
                                <div class="ms-list" id="list-novelAI"></div>
                            </div>
                            <div class="ms-tags" id="tags-novelAI"></div>
                        </div>
                    </div>

                </div><!-- /preset-stack -->
            </div><!-- /selector-grid -->
        </div>
    </div>

    <!-- Users -->
    <div class="card">
        <div class="card-header">
            <span>👥</span>
            <h2>Users</h2>
            <span class="badge" id="userBadge">—</span>
        </div>
        <div class="card-body">
            <div class="users-grid" id="userList">
                <div style="color:var(--text-faint);font-size:13px;">Loading…</div>
            </div>
        </div>
    </div>

</div><!-- /page -->

<div id="toast"></div>

<script>
    /* ── State ── */
    let state = {
        config: null,
        availableLorebooks: [],
        availablePresets: { openAI: [], textGen: [], novelAI: [] },
        regularUsers: [],
        userCount: 0,
        lbCounts: {},
        presetCounts: { openAI: {}, textGen: {}, novelAI: {} },
    };

    // Map prefix → { type, presetType } used in API calls
    const PREFIX_INFO = {
        lorebook: { type: 'lorebook', presetType: null },
        openAI:   { type: 'preset',   presetType: 'openAI'  },
        textGen:  { type: 'preset',   presetType: 'textGen' },
        novelAI:  { type: 'preset',   presetType: 'novelAI' },
    };

    let openDropdown = null;
    let csrfToken = '';

    /* ── CSRF ── */
    async function initCsrf() {
        try {
            const r = await fetch('/csrf-token', { credentials: 'include' });
            csrfToken = (await r.json()).token;
        } catch {
            showToast('Could not get CSRF token — refresh the page.', 'err');
        }
    }
    function postHeaders() {
        return { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken };
    }

    /* ── State accessors ── */
    function getMap(prefix) {
        if (prefix === 'lorebook') return state.config.lorebooks;
        return (state.config.presets[prefix] = state.config.presets[prefix] || {});
    }
    function getFiles(prefix) {
        if (prefix === 'lorebook') return state.availableLorebooks;
        return state.availablePresets[prefix] || [];
    }
    function getCounts(prefix) {
        if (prefix === 'lorebook') return state.lbCounts;
        return state.presetCounts[prefix] || {};
    }

    /* ── Load ── */
    async function loadStatus() {
        const icon = document.getElementById('refreshIcon');
        const btn  = document.getElementById('refreshBtn');
        icon.classList.add('spin'); btn.disabled = true;
        try {
            const r = await fetch('/api/sync-manager/status', { credentials: 'include' });
            if (!r.ok) throw new Error(await r.text());
            const data = await r.json();
            state = data;
            // Ensure nested presets map exists
            state.config.presets = { openAI: {}, textGen: {}, novelAI: {}, ...state.config.presets };
            render();
        } catch (e) {
            showToast('Failed to load: ' + e.message, 'err');
        } finally {
            icon.classList.remove('spin'); btn.disabled = false;
        }
    }

    /* ── Render ── */
    function render() {
        const { config, regularUsers, userCount } = state;

        document.getElementById('lastSynced').textContent =
            config.lastSyncedAt ? new Date(config.lastSyncedAt).toLocaleString() : 'Never';

        // Build all dropdowns
        for (const prefix of ['lorebook', 'openAI', 'textGen', 'novelAI']) {
            buildList(prefix);
            renderTags(prefix);
            updateTriggerText(prefix);
        }

        // Users
        renderUsers(regularUsers, config.optedOut);
        updateCounts();
    }

    /* ── Build dropdown item list ── */
    function buildList(prefix) {
        const files    = getFiles(prefix);
        const map      = getMap(prefix);
        const counts   = getCounts(prefix);
        const total    = state.userCount;
        const listEl   = document.getElementById(`list-${prefix}`);

        if (!files.length) {
            listEl.innerHTML = '<div class="ms-empty">No files found in admin\'s folder</div>';
            return;
        }

        listEl.innerHTML = files.map(f => {
            const checked = map[f] === true;
            const count   = counts[f] || 0;
            const countHtml = count > 0
                ? `<span class="ms-item-count">${count}/${total}</span>` : '';
            return `<label class="ms-item ${checked ? 'checked' : ''}" id="item-${prefix}-${CSS.escape(f)}">
                <input type="checkbox" ${checked ? 'checked' : ''}
                       onchange="toggleFile('${prefix}','${esc(f)}',this.checked)">
                <span class="ms-item-label" title="${esc(f)}">${esc(f.replace(/\.json$/, ''))}</span>
                ${countHtml}
            </label>`;
        }).join('');
    }

    /* ── Render tags below trigger ── */
    function renderTags(prefix) {
        const files  = getFiles(prefix);
        const map    = getMap(prefix);
        const counts = getCounts(prefix);
        const total  = state.userCount;
        const tagsEl = document.getElementById(`tags-${prefix}`);

        const selected = files.filter(f => map[f] === true);
        tagsEl.innerHTML = selected.map(f => {
            const count = counts[f] || 0;
            const live  = count > 0;
            const countSpan = live
                ? `<span class="ms-tag-count">${count}/${total}</span>` : '';
            const title = live
                ? `${f} — synced to ${count}/${total} users. Click × to unsync and remove from all users.`
                : `${f} — not yet synced. Click × to deselect.`;
            return `<div class="ms-tag ${live ? 'live' : ''}" title="${esc(title)}">
                <span class="ms-tag-name">${esc(f.replace(/\.json$/, ''))}</span>
                ${countSpan}
                <span class="ms-tag-remove" onclick="handleTagRemove('${prefix}','${esc(f)}')">×</span>
            </div>`;
        }).join('');
    }

    /* ── Tag × handler: unsync if live, deselect if not ── */
    async function handleTagRemove(prefix, filename) {
        const counts = getCounts(prefix);
        const count  = counts[filename] || 0;

        if (count > 0) {
            // Live — remove from all users' disks + disable in config
            const { type, presetType } = PREFIX_INFO[prefix];
            await unsyncFile(type, filename, presetType);
        } else {
            // Not yet on any user — just deselect
            toggleFile(prefix, filename, false);
            syncCheckbox(prefix, filename, false);
        }
    }

    /* ── Toggle a file on/off in local state ── */
    function toggleFile(prefix, filename, enabled) {
        const map = getMap(prefix);
        map[filename] = enabled;
        renderTags(prefix);
        updateTriggerText(prefix);
        updateCounts();
    }

    /* ── Sync checkbox DOM after external state change ── */
    function syncCheckbox(prefix, filename, checked) {
        const item = document.getElementById(`item-${prefix}-${CSS.escape(filename)}`);
        if (!item) return;
        item.querySelector('input').checked = checked;
        item.classList.toggle('checked', checked);
    }

    /* ── Dropdown open/close ── */
    function toggleDropdown(prefix) {
        const dropdown = document.getElementById(`dropdown-${prefix}`);
        const trigger  = document.getElementById(`trigger-${prefix}`);
        const isOpen   = dropdown.classList.contains('open');
        closeAllDropdowns();
        if (!isOpen) {
            dropdown.classList.add('open');
            trigger.classList.add('open');
            openDropdown = prefix;
            dropdown.querySelector('.ms-search')?.focus();
        }
    }

    function closeAllDropdowns() {
        document.querySelectorAll('.ms-dropdown.open').forEach(d => d.classList.remove('open'));
        document.querySelectorAll('.ms-trigger.open').forEach(t => t.classList.remove('open'));
        openDropdown = null;
    }

    document.addEventListener('click', e => {
        if (!e.target.closest('.ms-wrap')) closeAllDropdowns();
    });

    /* ── Filter dropdown list ── */
    function filterList(prefix, query) {
        const q = query.toLowerCase();
        const listEl = document.getElementById(`list-${prefix}`);
        listEl.querySelectorAll('.ms-item').forEach(item => {
            const label = item.querySelector('.ms-item-label').textContent.toLowerCase();
            item.classList.toggle('hidden', q.length > 0 && !label.includes(q));
        });
        const visible = listEl.querySelectorAll('.ms-item:not(.hidden)').length;
        let noResults = document.getElementById(`no-results-${prefix}`);
        if (visible === 0) {
            if (!noResults) {
                noResults = Object.assign(document.createElement('div'), {
                    className: 'ms-empty', id: `no-results-${prefix}`, textContent: 'No matches',
                });
                listEl.appendChild(noResults);
            }
            noResults.style.display = '';
        } else if (noResults) {
            noResults.style.display = 'none';
        }
    }

    /* ── Select / clear all visible ── */
    function selectAllVisible(prefix) {
        const files = getFiles(prefix);
        const map   = getMap(prefix);
        document.querySelectorAll(`#list-${prefix} .ms-item:not(.hidden)`).forEach(item => {
            const cb = item.querySelector('input');
            const f  = files.find(f => f.replace(/\.json$/, '') === item.querySelector('.ms-item-label').textContent.trim());
            if (f) { map[f] = true; cb.checked = true; item.classList.add('checked'); }
        });
        renderTags(prefix);
        updateTriggerText(prefix);
        updateCounts();
    }

    function clearAllVisible(prefix) {
        const files = getFiles(prefix);
        const map   = getMap(prefix);
        document.querySelectorAll(`#list-${prefix} .ms-item:not(.hidden)`).forEach(item => {
            const cb = item.querySelector('input');
            const f  = files.find(f => f.replace(/\.json$/, '') === item.querySelector('.ms-item-label').textContent.trim());
            if (f) { map[f] = false; cb.checked = false; item.classList.remove('checked'); }
        });
        renderTags(prefix);
        updateTriggerText(prefix);
        updateCounts();
    }

    /* ── Trigger text ── */
    function updateTriggerText(prefix) {
        const files = getFiles(prefix);
        const map   = getMap(prefix);
        const n   = files.filter(f => map[f] === true).length;
        const el  = document.getElementById(`triggerText-${prefix}`);
        if (n === 0) { el.textContent = 'None selected'; el.classList.remove('has-selection'); }
        else         { el.textContent = `${n} selected`;  el.classList.add('has-selection'); }
    }

    /* ── Update stats bar ── */
    function updateCounts() {
        const { config, availableLorebooks, availablePresets, regularUsers } = state;
        if (!config) return;
        const lbCount = availableLorebooks.filter(f => config.lorebooks[f] === true).length;
        const pCount  = Object.values(config.presets || {})
            .reduce((n, map) => n + Object.values(map).filter(Boolean).length, 0);
        document.getElementById('enabledCount').textContent =
            `${lbCount + pCount} (${lbCount} lorebooks, ${pCount} presets)`;
        document.getElementById('totalBadge').textContent = `${lbCount + pCount} selected`;
        const receiving = regularUsers.filter(h => !config.optedOut[h]).length;
        document.getElementById('syncUserCount').textContent = `${receiving} / ${state.userCount}`;
    }

    /* ── Save & Sync ── */
    async function saveAndSync() {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.innerHTML = '<span class="spin">⚡</span> Saving…';
        try {
            const saveR = await fetch('/api/sync-manager/config', {
                method: 'POST', credentials: 'include',
                headers: postHeaders(), body: JSON.stringify(state.config),
            });
            if (!saveR.ok) throw new Error('Config save failed: ' + (await saveR.text()));

            const syncR = await fetch('/api/sync-manager/sync-all', {
                method: 'POST', credentials: 'include', headers: postHeaders(),
            });
            const data = await syncR.json();
            if (!syncR.ok) throw new Error(data.error || syncR.statusText);

            const msg = `Saved & synced ${data.synced} file(s).`
                + (data.skipped ? ` ${data.skipped} skipped.` : '')
                + (data.errors?.length ? ` ⚠ ${data.errors.length} error(s).` : '');
            showToast(msg, 'ok');
            state.config.lastSyncedAt = new Date().toISOString();
            document.getElementById('lastSynced').textContent = new Date().toLocaleString();
        } catch (e) {
            showToast('Save failed: ' + e.message, 'err');
        } finally {
            btn.disabled = false; btn.innerHTML = '💾 Save &amp; Sync';
            // Refresh counts from server
            await loadStatus();
        }
    }

    /* ── Unsync: remove file from all users + disable in config ── */
    async function unsyncFile(type, filename, presetType) {
        try {
            const body = { type, filename };
            if (presetType) body.presetType = presetType;
            const r = await fetch('/api/sync-manager/unsync', {
                method: 'POST', credentials: 'include',
                headers: postHeaders(), body: JSON.stringify(body),
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || r.statusText);
            showToast(`Removed from ${data.removed} user(s).`, 'info');
        } catch (e) {
            showToast('Unsync failed: ' + e.message, 'err');
        } finally {
            await loadStatus();
        }
    }

    /* ── Users ── */
    function renderUsers(users, optedOut) {
        const el = document.getElementById('userList');
        document.getElementById('userBadge').textContent = `${users.length} total`;
        if (!users.length) {
            el.innerHTML = '<div style="color:var(--text-faint);font-size:13px;">No users found</div>';
            return;
        }
        el.innerHTML = users.map(h => {
            const out = !!optedOut[h];
            return `<div class="user-chip ${out ? 'opted-out' : ''}" id="chip-${CSS.escape(h)}">
                <div class="user-avatar">${h.slice(0, 2).toUpperCase()}</div>
                <div class="user-info">
                    <div class="user-name">${esc(h)}</div>
                    <div class="user-status">${out ? '⛔ de-synced' : '✓ syncing'}</div>
                </div>
                <label class="toggle">
                    <input type="checkbox" ${!out ? 'checked' : ''} onchange="toggleUser('${esc(h)}',this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>`;
        }).join('');
    }

    async function toggleUser(handle, syncEnabled) {
        state.config.optedOut[handle] = !syncEnabled;
        const chip = document.getElementById(`chip-${CSS.escape(handle)}`);
        if (chip) {
            chip.classList.toggle('opted-out', !syncEnabled);
            chip.querySelector('.user-status').textContent = !syncEnabled ? '⛔ de-synced' : '✓ syncing';
        }
        updateCounts();
        try {
            await fetch('/api/sync-manager/config', {
                method: 'POST', credentials: 'include',
                headers: postHeaders(), body: JSON.stringify(state.config),
            });
        } catch {}
    }

    /* ── Helpers ── */
    function showToast(msg, type = 'ok') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = `show ${type}`;
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 4500);
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    initCsrf().then(() => loadStatus());
</script>
</body>
</html>
