<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamTavern — Offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold-pale: #f4d58d;
    --gold: #d4a857;
    --gold-deep: #8a6520;
    --purple-deep: #1a0a2e;
    --purple-mid: #4a2079;
    --purple-glow: #7d3fb8;
    --rose: #c75b7a;
    --ink: #0d0418;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold-pale);
  }

  /* ============================================
     VIKTOR'S ANIMATED SHIFTING BACKGROUND
     ============================================ */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(125, 63, 184, 0.6), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(212, 168, 87, 0.4), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(199, 91, 122, 0.35), transparent 55%),
      radial-gradient(ellipse at 70% 20%, rgba(168, 85, 247, 0.3), transparent 45%),
      linear-gradient(135deg, #0d0418 0%, #1a0a2e 25%, #2d0f4f 50%, #4a2079 75%, #1a0a2e 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 200% 200%, 300% 300%;
    animation: bgShift 18s ease-in-out infinite;
  }

  .bg::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 25% 45%, rgba(244, 213, 141, 0.15), transparent 35%),
      radial-gradient(circle at 75% 55%, rgba(168, 85, 247, 0.2), transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(199, 91, 122, 0.15), transparent 35%);
    background-size: 250% 250%;
    animation: bgShift2 26s ease-in-out infinite reverse;
    mix-blend-mode: screen;
  }

  .bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 60% 30%, rgba(212, 168, 87, 0.12), transparent 30%),
      radial-gradient(circle at 40% 70%, rgba(125, 63, 184, 0.18), transparent 35%);
    background-size: 300% 300%;
    animation: bgShift3 22s ease-in-out infinite;
    mix-blend-mode: overlay;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%, 100% 50%, 50% 100%, 80% 20%, 0% 0%; }
    25% { background-position: 60% 30%, 40% 70%, 30% 50%, 20% 80%, 30% 30%; }
    50% { background-position: 100% 50%, 0% 50%, 80% 20%, 50% 50%, 60% 60%; }
    75% { background-position: 40% 80%, 60% 30%, 20% 70%, 70% 40%, 90% 30%; }
  }

  @keyframes bgShift2 {
    0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%; }
    50% { background-position: 100% 100%, 0% 0%, 0% 100%; }
  }

  @keyframes bgShift3 {
    0%, 100% { background-position: 50% 50%, 50% 50%; }
    50% { background-position: 0% 0%, 100% 100%; }
  }

  /* Soft blur veil */
  .veil {
    position: fixed; inset: 0; z-index: 1;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    background: rgba(13, 4, 24, 0.2);
  }

  /* ============================================
     VIKTOR'S GOLD SPARKLE PARTICLES
     ============================================ */
  .sparkles { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .sparkle {
    position: absolute;
    border-radius: 50%;
    animation: sparkleFloat linear infinite;
    opacity: 0;
  }

  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0.3); }
    15% { opacity: 1; }
    85% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-10vh) rotate(360deg) scale(0.1); }
  }

  /* ============================================
     MAIN LAYOUT — OPUS'S TWO-COLUMN GRID
     ============================================ */
  .stage {
    position: relative; z-index: 5;
    width: 100%; height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 6vh 5vw 4vh;
    gap: 4vw;
  }

  /* ============================================
     VIKTOR'S HOLOGRAPHIC SPINNING FRAME
     ============================================ */
  .portrait-wrapper {
    justify-self: end;
    position: relative;
    width: min(42vw, 520px);
    aspect-ratio: 2 / 3;
    animation: portraitFloat 8s ease-in-out infinite;
  }

  /* Holographic spinning border */
  .portrait-wrapper::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 8px;
    background: conic-gradient(
      from var(--holo-angle, 0deg),
      #d4a857, #f4d58d, #ffffff, #7d3fb8, #c75b7a,
      #d4a857, #f4d58d, #ffffff, #7d3fb8, #d4a857
    );
    animation: holoSpin 6s linear infinite;
    z-index: -1;
    filter: blur(1px);
  }

  /* Glow behind holographic border */
  .portrait-wrapper::after {
    content: "";
    position: absolute;
    inset: -20px;
    border-radius: 12px;
    background: conic-gradient(
      from var(--holo-angle, 0deg),
      rgba(212, 168, 87, 0.4), rgba(244, 213, 141, 0.2), rgba(125, 63, 184, 0.3),
      rgba(199, 91, 122, 0.2), rgba(212, 168, 87, 0.4)
    );
    animation: holoSpin 6s linear infinite;
    z-index: -2;
    filter: blur(25px);
  }

  @property --holo-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes holoSpin {
    to { --holo-angle: 360deg; }
  }

  .portrait-frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: var(--ink);
  }

  .portrait-frame img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Gold corner ornaments — from Opus */
  .corner {
    position: absolute;
    width: 50px; height: 50px;
    border: 2px solid var(--gold);
    z-index: 3;
    pointer-events: none;
    opacity: 0.8;
  }
  .corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  /* Float animation — starts lower, more subtle */
  @keyframes portraitFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Radial glow behind portrait */
  .portrait-glow {
    position: absolute;
    inset: -60px;
    background: radial-gradient(ellipse at center, rgba(212, 168, 87, 0.25), rgba(125, 63, 184, 0.15) 40%, transparent 65%);
    z-index: -3;
    filter: blur(30px);
    animation: glowPulse 6s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ============================================
     TEXT SIDE — OPUS'S COPY
     ============================================ */
  .message {
    justify-self: start;
    max-width: 580px;
    color: var(--gold-pale);
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }

  .ornament {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 1.4s ease-out 0.2s forwards;
  }
  .ornament .line {
    flex: 0 0 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament .diamond {
    width: 8px; height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 12px var(--gold);
  }
  .ornament .label {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
  }

  h1 {
    font-family: 'Tangerine', cursive;
    font-weight: 700;
    font-size: clamp(4rem, 9vw, 8rem);
    line-height: 0.95;
    color: transparent;
    background: linear-gradient(135deg, #f4d58d 0%, #ffffff 30%, #d4a857 50%, #f4d58d 70%, #c75b7a 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: shimmerText 6s ease-in-out infinite, fadeUp 1.6s ease-out 0.4s both;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 40px rgba(212, 168, 87, 0.3));
  }

  @keyframes shimmerText {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.85rem, 1.2vw, 1rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 1.4s ease-out 0.6s forwards;
  }

  /* Viktor accent: shimmer line under subtitle */
  .subtitle::after {
    content: "";
    display: block;
    margin-top: 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), rgba(125, 63, 184, 0.6), var(--gold), transparent);
    background-size: 200% 100%;
    animation: accentSweep 4s ease-in-out infinite;
  }

  @keyframes accentSweep {
    0%, 100% { background-position: -100% 0; }
    50% { background-position: 200% 0; }
  }

  .body-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.2rem, 1.8vw, 1.6rem);
    line-height: 1.6;
    color: rgba(244, 213, 141, 0.92);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 1.4s ease-out 0.8s forwards;
  }

  .body-text strong {
    font-style: normal;
    font-family: 'Pinyon Script', cursive;
    font-size: 1.4em;
    font-weight: 400;
    color: var(--gold-pale);
    text-shadow: 0 0 20px rgba(212, 168, 87, 0.6);
  }

  .footer {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 40px;
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(212, 168, 87, 0.7);
    opacity: 0;
    animation: fadeUp 1.4s ease-out 1.2s forwards;
  }

  .pulse-dot {
    width: 8px; height: 8px;
    background: var(--rose);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--rose), 0 0 20px var(--rose);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================================
     RESPONSIVE
     ============================================ */
  @media (max-width: 900px) {
    .stage {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      padding: 3vh 6vw;
      gap: 3vh;
      overflow-y: auto;
    }
    .portrait-wrapper {
      width: min(70vw, 320px);
      justify-self: center;
    }
    .message { justify-self: center; text-align: center; }
    .ornament { justify-content: center; }
    .footer { justify-content: center; }
    html, body { overflow-y: auto; }
  }
</style>
</head>

    s.style.animationDuration = (8 + Math.random() * 10) + 's';

    // Mix of gold and subtle purple sparkles
    if (Math.random() > 0.3) {
      s.style.background = '#d4a857';
      s.style.boxShadow = '0 0 ' + (3 + Math.random() * 6) + 'px #d4a857, 0 0 ' + (8 + Math.random() * 10) + 'px #f4d58d';
    } else if (Math.random() > 0.5) {
      s.style.background = '#f4d58d';
      s.style.boxShadow = '0 0 4px #f4d58d, 0 0 10px #f4d58d';
    } else {
      s.style.background = '#7d3fb8';
      s.style.boxShadow = '0 0 4px #7d3fb8, 0 0 8px #a855f7';
    }

    sparkleField.appendChild(s);
  }
</script>

</body>
</html>
