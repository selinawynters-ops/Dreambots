<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        /* Critical CSS — prevents flash of unstyled content */
        body {
            background-color: #08080f;
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <!-- fontawesome webfonts -->
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <title>DreamTavern</title>
</head>

<body class="login">

    <!-- ============================================================
         CINEMATIC BACKGROUND LAYERS
         ============================================================ -->
    <div class="login-bg-image" aria-hidden="true"></div>
    <div class="login-vignette" aria-hidden="true"></div>
    <div class="login-ambient" aria-hidden="true"></div>

    <!-- Warm ember sparks -->
    <div class="login-spark" style="left:12%;animation-duration:7s;animation-delay:0s;" aria-hidden="true"></div>
    <div class="login-spark" style="left:28%;animation-duration:10s;animation-delay:2s;width:3px;height:3px;" aria-hidden="true"></div>
    <div class="login-spark" style="left:48%;animation-duration:8s;animation-delay:1s;" aria-hidden="true"></div>
    <div class="login-spark" style="left:68%;animation-duration:11s;animation-delay:3s;" aria-hidden="true"></div>
    <div class="login-spark" style="left:82%;animation-duration:9s;animation-delay:4.5s;width:3px;height:3px;opacity:0.4;" aria-hidden="true"></div>
    <div class="login-spark" style="left:20%;animation-duration:12s;animation-delay:5s;" aria-hidden="true"></div>
    <div class="login-spark" style="left:75%;animation-duration:7s;animation-delay:0.5s;" aria-hidden="true"></div>

    <!-- Purple mist particles -->
    <div class="login-particle" style="left:8%;animation-duration:9s;animation-delay:0s;width:2px;height:2px;" aria-hidden="true"></div>
    <div class="login-particle" style="left:35%;animation-duration:13s;animation-delay:3s;" aria-hidden="true"></div>
    <div class="login-particle" style="left:58%;animation-duration:10s;animation-delay:5s;width:2px;height:2px;" aria-hidden="true"></div>
    <div class="login-particle" style="left:88%;animation-duration:11s;animation-delay:2s;" aria-hidden="true"></div>
    <div class="login-particle" style="left:42%;animation-duration:14s;animation-delay:7s;width:4px;height:4px;opacity:0.2;" aria-hidden="true"></div>

    <!-- ============================================================
         MAIN LOGIN CONTAINER
         All element IDs preserved for login.js compatibility
         ============================================================ -->
    <div id="shadow_popup" style="opacity: 0;">
        <div class="login-panel">

            <!-- Image Side (Hero) -->
            <div class="login-image-side">
                <img src="img/login-hero.png" alt="DreamTavern" draggable="false">
            </div>

            <!-- Form Side -->
            <div class="login-form-side">
                <div id="dialogue_popup">
                    <div id="dialogue_popup_holder">
                        <div id="dialogue_popup_text">
                            <div id="userSelectBlock">

                                <!-- Brand -->
                                <h2 id="logoBlock">
                                    <span class="brand-title">DreamTavern</span>
                                    <span class="brand-subtitle">Enter the Dream Realm</span>
                                </h2>

                                <!-- Login mode prompts (toggled by login.js) -->
                                <h3 id="normalLoginPrompt">Select an Account</h3>
                                <h3 id="discreetLoginPrompt">Enter Login Details</h3>

                                <div id="userListBlock" class="wide100p">

                                    <!-- Normal mode: user avatar grid -->
                                    <div id="userList" class="flex-container justifySpaceEvenly"></div>

                                    <!-- Discreet mode: handle entry -->
                                    <div id="handleEntryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                        <label class="field-label" for="userHandle">Username</label>
                                        <input id="userHandle" class="text_pole" type="text" placeholder="Your handle" autocomplete="username">
                                    </div>

                                    <!-- Password entry (shown after user selection or in discreet mode) -->
                                    <div id="passwordEntryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                        <label class="field-label" for="userPassword">Password</label>
                                        <div class="password-wrapper">
                                            <input id="userPassword" class="text_pole" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password">
                                            <span class="eye-toggle" id="togglePassword" role="button" aria-label="Toggle password visibility" tabindex="0">
                                                <i class="fa-solid fa-eye"></i>
                                            </span>
                                        </div>
                                        <a id="recoverPassword" href="#" onclick="return false;">Forgot password?</a>

                                        <!-- 2FA UI Prep (not wired to backend yet) -->
                                        <div class="twofa-section">
                                            <div class="twofa-header">
                                                <div class="twofa-icon"><i class="fa-solid fa-lock"></i></div>
                                                <span class="twofa-label">Two-Factor Auth</span>
                                                <span class="twofa-badge">OPTIONAL</span>
                                            </div>
                                            <div class="twofa-inputs">
                                                <input type="text" maxlength="1" class="twofa-box" placeholder="&mdash;" aria-label="2FA digit 1">
                                                <input type="text" maxlength="1" class="twofa-box" placeholder="&mdash;" aria-label="2FA digit 2">
                                                <input type="text" maxlength="1" class="twofa-box" placeholder="&mdash;" aria-label="2FA digit 3">
                                                <input type="text" maxlength="1" class="twofa-box" placeholder="&mdash;" aria-label="2FA digit 4">
                                                <input type="text" maxlength="1" class="twofa-box" placeholder="&mdash;" aria-label="2FA digit 5">
                                                <input type="text" maxlength="1" class="twofa-box" placeholder="&mdash;" aria-label="2FA digit 6">
                                            </div>
                                        </div>

                                        <div class="flex-container">
                                            <div id="loginButton" class="menu_button">Enter the Dream</div>
                                        </div>
                                    </div>

                                    <!-- Password recovery -->
                                    <div id="passwordRecoveryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                        <div id="recoverMessage">
                                            Recovery code has been posted to the server console.
                                        </div>
                                        <input id="recoveryCode" class="text_pole" type="text" placeholder="Recovery code">
                                        <input id="newPassword" class="text_pole" type="password" placeholder="New password" autocomplete="new-password">
                                        <div class="flex-container flexGap10">
                                            <div id="sendRecovery" class="menu_button">Send</div>
                                            <div id="cancelRecovery" class="menu_button">Cancel</div>
                                        </div>
                                    </div>

                                </div>

                                <div class="neutral_warning" id="errorMessage"></div>
                                <div class="login-footer">Your dream Awaits</div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
    <script>
        // Password visibility toggle
        document.addEventListener('DOMContentLoaded', function () {
            var toggle = document.getElementById('togglePassword');
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var pw = document.getElementById('userPassword');
                    var icon = toggle.querySelector('i');
                    if (pw.type === 'password') {
                        pw.type = 'text';
                        icon.classList.replace('fa-eye', 'fa-eye-slash');
                    } else {
                        pw.type = 'password';
                        icon.classList.replace('fa-eye-slash', 'fa-eye');
                    }
                });
            }

            // 2FA auto-advance between digit boxes
            var boxes = document.querySelectorAll('.twofa-box');
            boxes.forEach(function (box, i) {
                box.addEventListener('input', function () {
                    if (box.value.length === 1 && i < boxes.length - 1) {
                        boxes[i + 1].focus();
                    }
                });
                box.addEventListener('keydown', function (e) {
                    if (e.key === 'Backspace' && !box.value && i > 0) {
                        boxes[i - 1].focus();
                    }
                });
                // Only allow digits
                box.addEventListener('beforeinput', function (e) {
                    if (e.data && !/^\d$/.test(e.data)) {
                        e.preventDefault();
                    }
                });
            });
        });
    </script>
</body>

</html>
